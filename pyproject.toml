[project]
name = "flatfind"
version = "0.1.0"
description = "Agent workspace for finding a flat in Zurich"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
flatfind = "flatfind.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
